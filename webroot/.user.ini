; Flussu — per-app PHP overrides
;
; webroot/ è il document root servito da PHP-FPM. PHP legge questo file ad
; ogni request (con cache di 300s di default — vedi user_ini.cache_ttl) e
; applica le direttive PHP_INI_PERDIR / PHP_INI_USER.
;
; Lo scopo qui è onorare il limite documentato di 20MB per file caricati
; via /flucli/upload.SRV.php. I default di sistema (upload_max_filesize=2M,
; post_max_size=8M) erano molto sotto soglia.
;
; post_max_size deve essere >= upload_max_filesize, con un piccolo margine
; per gli altri campi del form multipart.

upload_max_filesize = 25M
post_max_size       = 30M
